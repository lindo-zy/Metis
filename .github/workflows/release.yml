name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (iOS16/17)
    runs-on: macos-14
    timeout-minutes: 60
    env:
      THEOS: /Users/runner/work/_theos
      METIS_ALLOW_DIRTY: '1'   # tag 检出为 detached HEAD，本地分支纪律检查不适用
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install ldid dpkg make

      - name: Set up Theos (roothide fork)
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"

      - name: Prepare SDKs
        run: |
          # iPhoneOS16.5：theos/sdks 提供（含私有框架 tbd）。
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
          # iPhoneOS17.0：theos/sdks 未收录；用 runner Xcode 的 iOS SDK 组装
          # overlay（公开框架/ usr 链接 + 仓库内 vendored 私有框架 tbd 存根，
          # 部署线仍为 16.0；实际 SDK 小版本写入 release 说明）。
          XCODE_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p "$THEOS/sdks/iPhoneOS17.0.sdk/System/Library/PrivateFrameworks"
          ln -s "$XCODE_SDK/System/Library/Frameworks" "$THEOS/sdks/iPhoneOS17.0.sdk/System/Library/Frameworks"
          ln -s "$XCODE_SDK/usr" "$THEOS/sdks/iPhoneOS17.0.sdk/usr"
          ln -s "$XCODE_SDK/SDKSettings.plist" "$THEOS/sdks/iPhoneOS17.0.sdk/SDKSettings.plist"
          cp -R sdks/stubs/System/Library/PrivateFrameworks/* \
            "$THEOS/sdks/iPhoneOS17.0.sdk/System/Library/PrivateFrameworks/"
          echo "Xcode iPhoneOS SDK: $XCODE_SDK"

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: tag must be vMAJOR.MINOR.PATCH, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build release (both targets)
        run: |
          ./build.sh --target all --mode release --version "${{ steps.version.outputs.version }}"

      - name: Collect artifacts
        run: |
          mkdir -p release-artifacts
          cp packages/ios16/*.deb packages/ios17/*.deb release-artifacts/
          cp packages/ios16/manifest-*.json "release-artifacts/manifest-${{ steps.version.outputs.version }}-ios16.json"
          cp packages/ios17/manifest-*.json "release-artifacts/manifest-${{ steps.version.outputs.version }}-ios17.json"
          ls -la release-artifacts/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          XCODE_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          cat > release-notes.md <<EOF
          # Metis ${VERSION}

          截图与标注 · 键盘与操作 · 剪贴板，三模块合一。

          - 系统设置唯一入口「Metis」；总开关默认开，三个模块默认关（按需启用）。
          - iOS16 变体：iPhoneOS16.5 SDK，部署目标 16.0。
          - iOS17 变体：${XCODE_SDK}（17.x），部署目标 16.0。
          - 架构：arm64 / arm64e（RootHide）。
          - SHA256 与构建元数据见 manifest JSON。
          - 状态：package-verified（构建与包检查通过）；真机验收待验。
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            release-artifacts/*.deb release-artifacts/*.json \
            --title "Metis ${VERSION}" \
            --notes-file release-notes.md
